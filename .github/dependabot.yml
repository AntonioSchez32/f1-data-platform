# Actualizaciones de dependencias: una vez por semana y agrupadas por ecosistema, para que
# lleguen como pocos PR que la CI valida antes de fusionarlos.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: tuesday
    groups:
      web-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: tuesday
