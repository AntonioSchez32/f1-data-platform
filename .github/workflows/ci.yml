# Integración continua: lint y pruebas de Python en cada cambio, y el modelo dbt completo
# (modelos, tests unitarios, pruebas de datos y umbrales de calidad) contra el último snapshot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint y pruebas de Python
    # Imagen fijada: ubuntu-latest pasa a Ubuntu 26.04 el 19/10/2026. Revisar la subida
    # (Playwright --with-deps, uv) antes de cambiarla.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  dbt:
    name: Modelo dbt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # Clave propia: los jobs en paralelo no compiten por guardar la misma caché.
          cache-suffix: dbt
      - run: uv sync --locked

      - name: Descargar el último snapshot de datos
        id: data
        # Snapshot verificado (bronze.tar.gz con el SHA-256 de su manifiesto) de data-latest o, si
        # está a medias, de la release fechada más reciente (auditoría ING-01). Si aún no trae
        # Jolpica (antes de la primera ejecución del pipeline con D2), tablas vacías con su esquema
        # para que dbt pueda ejecutarse: la CI no llama a Jolpica (sin red ni contenido externo).
        run: |
          if bash scripts/descargar_snapshot.sh snapshot data-latest; then
            uv run f1-ingest snapshot restore snapshot/bronze.tar.gz
            uv run f1-ingest jolpica --empty-if-missing
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay snapshot publicado (release data-latest): solo se comprueba que el proyecto dbt compila."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: dbt parse
        working-directory: transform
        run: uv run dbt parse --profiles-dir .

      - name: dbt build
        if: steps.data.outputs.available == 'true'
        working-directory: transform
        run: uv run dbt build --profiles-dir .

      # La misma prueba que hace el pipeline antes de publicar: la API contra el snapshot generado
      # y sin tablas que pierdan filas respecto al publicado.
      - name: Prueba de humo de la API contra el snapshot generado
        if: steps.data.outputs.available == 'true'
        env:
          F1_SMOKE_DB: dist/f1.duckdb
          F1_SMOKE_PREVIOUS_MANIFEST: snapshot/manifest.json
        run: |
          uv run f1-ingest snapshot pack --out dist
          uv run pytest api/tests/smoke -v -p no:cacheprovider

      - name: Guardar los logs de dbt
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-logs
          path: |
            transform/logs/
            transform/target/run_results.json
          if-no-files-found: ignore

  api-image:
    name: Imagen Docker de la API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Con el repositorio, la imagen lleva la copia de respaldo de los datos (como en Render).
      - name: Construir la imagen
        run: docker build -f api/Dockerfile --build-arg F1_DATA_REPO="$GITHUB_REPOSITORY" -t f1-api .

      - name: Descargar la base de datos publicada
        id: data
        run: |
          if gh release download data-latest --pattern f1.duckdb --pattern manifest.json --dir apidata; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay snapshot publicado: solo se comprueba que la imagen se construye."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prueba de humo (arranque y consultas)
        if: steps.data.outputs.available == 'true'
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/apidata:/snapshot:ro" \
            -e F1_API_DB_PATH=/snapshot/f1.duckdb f1-api
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/seasons | head -c 300
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/races/999999)" = 404

      # Si GitHub no da los datos al arrancar (aquí, una release que no existe), la API arranca
      # con la copia de la imagen y lo indica en /health.
      - name: Arranque sin GitHub con la copia de la imagen
        if: steps.data.outputs.available == 'true'
        run: |
          docker run -d --name api-copy -p 8001:8000 -e F1_DATA_REPO="$GITHUB_REPOSITORY" -e F1_DATA_TAG=release-inexistente f1-api
          for _ in $(seq 1 30); do curl -fsS localhost:8001/health > /dev/null && break; sleep 2; done
          curl -fsS localhost:8001/health | tee health.json
          grep -q '"status":"degraded"' health.json
          grep -q '"source":"copy"' health.json
          curl -fsS localhost:8001/seasons | head -c 300

      - name: Logs de los contenedores
        if: failure() && steps.data.outputs.available == 'true'
        run: |
          docker logs api || true
          docker logs api-copy || true

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      F1_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # Clave propia: los jobs en paralelo no compiten por guardar la misma caché.
          cache-suffix: web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: web

      - name: Tipos de la API al día con el contrato OpenAPI
        run: |
          uv run python scripts/export_openapi.py
          (cd web && npm run gen:api)
          git diff --exit-code web/src/lib/api

      - name: Pruebas unitarias (Vitest)
        working-directory: web
        run: npm test

      - name: Lint, tipos y compilación
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Descargar la base de datos publicada
        id: data
        run: |
          if gh release download data-latest --pattern f1.duckdb --pattern manifest.json --dir apidata; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay snapshot publicado: se omiten las pruebas de extremo a extremo."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pruebas de extremo a extremo y accesibilidad (Playwright + axe)
        if: steps.data.outputs.available == 'true'
        env:
          F1_API_DB_PATH: ${{ github.workspace }}/apidata/f1.duckdb
        run: |
          uv run uvicorn api.app.main:app --port 8000 &
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health > /dev/null && break; sleep 2; done
          cd web
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
