# Integración continua: lint y pruebas de Python en cada cambio, y el modelo dbt completo
# (modelos, tests unitarios, pruebas de datos y umbrales de calidad) contra el último snapshot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint y pruebas de Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  dbt:
    name: Modelo dbt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Descargar el último snapshot de datos
        id: data
        run: |
          if gh release download data-latest --pattern bronze.tar.gz --dir snapshot; then
            uv run f1-ingest snapshot restore snapshot/bronze.tar.gz
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay snapshot publicado (release data-latest): solo se comprueba que el proyecto dbt compila."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: dbt parse
        working-directory: transform
        run: uv run dbt parse --profiles-dir .

      - name: dbt build
        if: steps.data.outputs.available == 'true'
        working-directory: transform
        run: uv run dbt build --profiles-dir .

      - name: Guardar los logs de dbt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs
          path: |
            transform/logs/
            transform/target/run_results.json
          if-no-files-found: ignore

  api-image:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -f api/Dockerfile -t f1-api .

      - name: Descargar la base de datos publicada
        id: data
        run: |
          if gh release download data-latest --pattern f1.duckdb --pattern manifest.json --dir apidata; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay snapshot publicado: solo se comprueba que la imagen se construye."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prueba de humo (arranque y consultas)
        if: steps.data.outputs.available == 'true'
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/apidata:/snapshot:ro" \
            -e F1_API_DB_PATH=/snapshot/f1.duckdb f1-api
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/seasons | head -c 300
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/races/999999)" = 404

      - name: Logs del contenedor
        if: failure() && steps.data.outputs.available == 'true'
        run: docker logs api

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      F1_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: web

      - name: Tipos de la API al día con el contrato OpenAPI
        run: |
          uv run python scripts/export_openapi.py
          (cd web && npm run gen:api)
          git diff --exit-code web/src/lib/api

      - name: Lint, tipos y compilación
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Descargar la base de datos publicada
        id: data
        run: |
          if gh release download data-latest --pattern f1.duckdb --pattern manifest.json --dir apidata; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hay snapshot publicado: se omiten las pruebas de extremo a extremo."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pruebas de extremo a extremo y accesibilidad (Playwright + axe)
        if: steps.data.outputs.available == 'true'
        env:
          F1_API_DB_PATH: ${{ github.workspace }}/apidata/f1.duckdb
        run: |
          uv run uvicorn api.app.main:app --port 8000 &
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health > /dev/null && break; sleep 2; done
          cd web
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
