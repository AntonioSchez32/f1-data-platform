# Pipeline de datos: parte del último snapshot publicado, añade lo nuevo (F1DB, OpenF1 de forma
# incremental con su copia en la release `bronze-openf1`, y la copia de FastF1 que el autor carga
# en su equipo, release `bronze-fastf1`), reconstruye el modelo con dbt, prueba la API contra el
# resultado y publica el snapshot en una release fechada e inmutable (`data-AAAA-MM-DD`) y en
# `data-latest`. Ver README, sección «Pipeline».
name: Pipeline de datos

on:
  schedule:
    # Lunes a las 06:00 UTC: los datos de cronometraje del GP del domingo ya están publicados.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_f1db:
        description: "Recargar F1DB aunque no haya release nueva"
        type: boolean
        default: false
      allow_shrink:
        description: "Emergencia: publicar aunque alguna tabla pierda filas sin declararlo en cambios_esperados.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

env:
  # Release que se sobrescribe en cada ejecución: la usan la API, la CI y quien quiera los datos.
  DATA_TAG: data-latest
  # Copia inmutable de formula1db.com y Ergast, que no se pueden volver a obtener. Nunca se
  # sobrescribe: si cambian esas fuentes, se publica una versión nueva (v2).
  STATIC_TAG: bronze-static-v1
  # Copia de bronze/fastf1 que el autor carga y publica desde su equipo con
  # `f1-ingest fastf1-publish` (ver el paso «Descargar la copia de FastF1»).
  FASTF1_TAG: bronze-fastf1
  # Copia incremental de bronze/openf1 que gestiona el propio pipeline (decisión 24).
  OPENF1_TAG: bronze-openf1
  # Tiempo máximo de la ingesta de OpenF1 por ejecución: si se agota, lo pendiente se carga en la
  # siguiente, pero la copia se guarda (la carga completa 2023+ tarda unos 40 minutos).
  OPENF1_MAX_MINUTES: 50
  # Releases fechadas que se conservan (unas 8 semanas).
  KEEP_DATED_RELEASES: 8
  GH_REPO: ${{ github.repository }}

jobs:
  pipeline:
    name: Ingesta, dbt build y publicación
    # Imagen fijada: ubuntu-latest pasa a Ubuntu 26.04 el 19/10/2026. Revisar la subida
    # (Playwright --with-deps, uv) antes de cambiarla.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      # El token solo llega a los pasos que usan `gh`, no a los que ejecutan código de Python
      # (f1-ingest, FastF1, pandas, dbt): la descarga y la restauración van en pasos separados.
      - name: Descargar el último snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$DATA_TAG" --pattern bronze.tar.gz --pattern manifest.json --dir snapshot; then
            SOURCE="$DATA_TAG"
          else
            # data-latest no existe o está a medias: se parte de la última release fechada.
            SOURCE="$(gh release list --limit 200 --json tagName,createdAt \
              | jq -r '[.[] | select(.tagName | test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}"))] | sort_by(.createdAt) | last | .tagName // empty')"
            if [ -z "$SOURCE" ] || ! gh release download "$SOURCE" --pattern bronze.tar.gz --pattern manifest.json --dir snapshot --clobber; then
              echo "::error::No hay ningún snapshot publicado ($DATA_TAG ni releases fechadas). Publica el snapshot inicial desde el equipo con los datos del TFG (README, sección «Pipeline»)."
              exit 1
            fi
            echo "::warning::No se pudo descargar $DATA_TAG; se parte de la release $SOURCE."
          fi
          echo "Snapshot de partida: $SOURCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Descargar la copia inmutable de las fuentes estáticas
        id: static
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$STATIC_TAG" > /dev/null 2>&1; then
            gh release download "$STATIC_TAG" --pattern bronze-static.tar.gz --dir static
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # FastF1 no se descarga aquí: livetiming.formula1.com (CloudFront) responde 403 a los
      # runners de GitHub Actions con cualquier User-Agent (se ve en el paso de diagnóstico) y
      # 200 desde una conexión doméstica. El autor la carga en su equipo tras cada GP y la publica
      # con `f1-ingest fastf1-publish`. Si falta, no cuadra con su manifiesto o está a medio
      # subir, se avisa y FastF1 queda como en el snapshot (que ya incluye las copias anteriores):
      # no impide publicar lo demás.
      - name: Descargar la copia de FastF1 del equipo del autor
        id: fastf1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          used=false
          if ! gh release view "$FASTF1_TAG" > /dev/null 2>&1; then
            echo "::warning::No existe la release $FASTF1_TAG: FastF1 queda como en el snapshot. Publícala desde el equipo del autor con «f1-ingest fastf1-publish» (README, sección «Pipeline»)."
          elif ! gh release download "$FASTF1_TAG" --pattern bronze-fastf1.tar.gz --pattern bronze-fastf1.json --dir fastf1 \
              || [ ! -f fastf1/bronze-fastf1.tar.gz ] || [ ! -f fastf1/bronze-fastf1.json ]; then
            echo "::warning::No se pudo descargar la copia de FastF1 completa (¿se está subiendo una nueva?): FastF1 queda como en el snapshot."
          else
            # El manifiesto se sube el último: si no cuadra, la copia está a medio subir.
            expected="$(jq -r '.files["bronze-fastf1.tar.gz"].sha256 // empty' fastf1/bronze-fastf1.json || true)"
            actual="$(sha256sum fastf1/bronze-fastf1.tar.gz | cut -d' ' -f1)"
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "::warning::La copia de FastF1 no coincide con su manifiesto (¿se está subiendo una nueva?): FastF1 queda como en el snapshot."
            else
              used=true
              echo "Copia de FastF1: $FASTF1_TAG del $(jq -r '.generated_at' fastf1/bronze-fastf1.json) (sha256 ${actual:0:12})" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$used" = "false" ]; then
            echo "Copia de FastF1: no usada; FastF1 queda como en el snapshot de partida." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "used=$used" >> "$GITHUB_OUTPUT"

      # OpenF1 sí responde desde GitHub Actions: el pipeline lo carga de forma incremental y guarda
      # su copia en la release `bronze-openf1` (decisión 24). Estados: missing (no existe: carga
      # completa 2023+ y se crea), verified (descargada y con el SHA-256 de su manifiesto) o
      # unverified (existe pero no se pudo descargar o no cuadra: se parte del OpenF1 del snapshot y
      # la release solo se sobrescribe si la copia nueva contiene todo lo que lista su manifiesto;
      # si ni eso se puede leer, para recuperarla se borra la release y se crea de nuevo).
      - name: Descargar la copia de OpenF1
        id: openf1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=missing
          if gh release view "$OPENF1_TAG" > /dev/null 2>&1; then
            state=unverified
            if gh release download "$OPENF1_TAG" --pattern bronze-openf1.tar.gz --pattern bronze-openf1.json --dir openf1 \
                && [ -f openf1/bronze-openf1.tar.gz ] && [ -f openf1/bronze-openf1.json ]; then
              expected="$(jq -r '.files["bronze-openf1.tar.gz"].sha256 // empty' openf1/bronze-openf1.json || true)"
              actual="$(sha256sum openf1/bronze-openf1.tar.gz | cut -d' ' -f1)"
              if [ -n "$expected" ] && [ "$expected" = "$actual" ]; then
                state=verified
              fi
            fi
          fi
          case "$state" in
            missing)
              echo "Copia de OpenF1: no existe la release $OPENF1_TAG; se crea en esta ejecución (carga completa 2023+)." >> "$GITHUB_STEP_SUMMARY" ;;
            unverified)
              echo "::warning::No se pudo descargar o verificar la copia de OpenF1: se parte del OpenF1 del snapshot y la release $OPENF1_TAG solo se sobrescribe si la copia nueva contiene lo que lista su manifiesto (si no, bórrala y la siguiente ejecución la crea de nuevo)."
              echo "Copia de OpenF1: no verificada; se parte del OpenF1 del snapshot." >> "$GITHUB_STEP_SUMMARY" ;;
            verified)
              echo "Copia de OpenF1: $OPENF1_TAG del $(jq -r '.generated_at' openf1/bronze-openf1.json) (sha256 ${actual:0:12})" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Restaurar bronze
        env:
          STATIC_EXISTS: ${{ steps.static.outputs.exists }}
          FASTF1_USED: ${{ steps.fastf1.outputs.used }}
          OPENF1_STATE: ${{ steps.openf1.outputs.state }}
        run: |
          uv run f1-ingest snapshot restore snapshot/bronze.tar.gz
          if [ "$STATIC_EXISTS" = "true" ]; then
            # Sustituye formula1db.com y Ergast por la copia inmutable: un snapshot dañado no
            # puede alterarlas.
            uv run f1-ingest snapshot restore static/bronze-static.tar.gz --replace
          else
            # Primera ejecución: la copia se crea a partir del bronze restaurado (falla si faltan
            # fuentes) y se publica en el paso siguiente.
            uv run f1-ingest snapshot pack-static --out static
          fi
          if [ "$FASTF1_USED" = "true" ]; then
            # Superposición, sin --replace: cada carrera de la copia sustituye a la del snapshot y
            # las que no trae se conservan, así que una copia incompleta no borra nada (se avisa
            # si trae menos carreras que el snapshot o si es más antigua que la ya usada). Solo
            # admite ficheros bronze/fastf1/<tabla>/season=AAAA/round=RR.parquet: con cualquier
            # otro miembro, el pipeline se detiene antes de extraer nada.
            uv run f1-ingest snapshot restore-fastf1 fastf1/bronze-fastf1.tar.gz \
              --previous snapshot/manifest.json --copy-manifest fastf1/bronze-fastf1.json
          fi
          if [ "$OPENF1_STATE" = "verified" ]; then
            # Superposición, como FastF1: solo admite los ficheros de bronze/openf1.
            uv run f1-ingest snapshot restore-openf1 openf1/bronze-openf1.tar.gz
          fi

      - name: Publicar la copia inmutable de las fuentes estáticas (solo la primera vez)
        if: steps.static.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$STATIC_TAG" static/bronze-static.tar.gz --latest=false \
            --title "Fuentes estáticas (formula1db.com y Ergast)" \
            --notes "Copia inmutable de las fuentes que ya no se pueden volver a obtener. No se sobrescribe nunca; el pipeline la restaura en cada ejecución. Licencias: formula1db.com, con permiso de su autor; Ergast, CC BY-NC-SA 3.0."
          echo "::notice::Creada la release $STATIC_TAG con las fuentes estáticas."

      - name: Ingesta de F1DB
        env:
          FORCE: ${{ inputs.force_f1db && '--force' || '' }}
        run: uv run f1-ingest f1db $FORCE

      # Solo las sesiones terminadas que faltan (2023+). No detiene el pipeline (decisión 26): lo
      # que falte (red, 5xx, 401/403 durante una sesión en directo, tiempo agotado) se lista en el
      # resumen y se pide en la siguiente ejecución; la carrera sale igualmente con los resultados
      # de F1DB.
      - name: Ingesta de OpenF1 (incremental)
        continue-on-error: true
        # Red de seguridad por encima de --max-minutes: si el paso se cuelga, el job sigue.
        timeout-minutes: 60
        run: uv run f1-ingest openf1 --max-minutes "$OPENF1_MAX_MINUTES" --summary "$GITHUB_STEP_SUMMARY"

      - name: Empaquetar la copia de OpenF1
        id: openf1_pack
        env:
          OPENF1_STATE: ${{ steps.openf1.outputs.state }}
        run: |
          uv run f1-ingest snapshot pack-openf1 --out openf1-new \
            --release-state "$OPENF1_STATE" --previous openf1/bronze-openf1.json

      # Solo si la release no existe o se verificó y la copia nueva contiene a la publicada (ver
      # snapshot.openf1_upload_decision). El tarball primero y el manifiesto el último: si la
      # siguiente ejecución descarga a mitad de la subida, el SHA-256 no cuadra y no sobrescribe.
      - name: Subir la copia de OpenF1
        id: openf1_upload
        if: steps.openf1_pack.outputs.upload == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$OPENF1_TAG" > /dev/null 2>&1; then
            gh release create "$OPENF1_TAG" --latest=false \
              --title "OpenF1 (copia incremental del pipeline)" \
              --notes "Copia de bronze/openf1 (OpenF1, https://openf1.org, 2023+) que el pipeline descarga, completa con las sesiones nuevas y vuelve a subir. Datos de OpenF1 bajo licencia CC BY-NC-SA 4.0 (no comercial, compartir igual); proyecto no oficial, sin relación con la F1 ni con la FIA."
          fi
          gh release upload "$OPENF1_TAG" openf1-new/bronze-openf1.tar.gz --clobber
          gh release upload "$OPENF1_TAG" openf1-new/bronze-openf1.json --clobber
          echo "Copia de OpenF1 subida a $OPENF1_TAG." >> "$GITHUB_STEP_SUMMARY"

      # Diagnóstico (no detiene el pipeline): si el servidor de cronometraje de la F1 vuelve a
      # aceptar las IP de GitHub, FastF1 podría volver a cargarse aquí. OpenF1 ya se carga arriba;
      # Jolpica (Ergast) será la segunda fuente de contraste (D2).
      - name: Acceso al cronometraje de la F1 y a otras fuentes (diagnóstico)
        continue-on-error: true
        run: |
          base="https://livetiming.formula1.com/static"
          for path in "2026/Index.json" "2018/2018-09-02_Italian_Grand_Prix/2018-09-02_Race/SessionInfo.json"; do
            for agent in "BestHTTP" "curl/8"; do
              code=$(curl -sS -o /dev/null -m 30 -A "$agent" -w '%{http_code} %{size_download}B %{time_total}s' "$base/$path" || true)
              echo "$path (User-Agent $agent): $code"
            done
          done
          curl -sSI -m 30 -A BestHTTP "$base/2026/Index.json" | grep -iE '^(HTTP|server|via|x-cache|cf-|x-amz|akamai)' || true
          year="$(date -u +%Y)"
          for url in "https://api.openf1.org/v1/sessions?year=$year&session_name=Race" \
                     "https://api.jolpi.ca/ergast/f1/$year/results/?limit=1"; do
            code=$(curl -sS -o /dev/null -m 30 -w '%{http_code} %{size_download}B %{time_total}s' "$url" || true)
            echo "$url: $code"
          done

      - name: dbt build (modelos y pruebas de calidad)
        working-directory: transform
        run: uv run dbt build --profiles-dir .

      - name: Nombre de la release fechada
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%F)"
          # Otra ejecución el mismo día: las releases fechadas no se sobrescriben nunca.
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generar el snapshot
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FASTF1_USED: ${{ steps.fastf1.outputs.used }}
          OPENF1_REFERENCE: ${{ steps.openf1_pack.outputs.reference }}
          OPENF1_UPLOADED: ${{ steps.openf1_upload.outcome }}
        run: |
          # El manifiesto y las notas indican la copia de FastF1 usada (fecha y SHA-256) o «no usada»,
          # y la copia de OpenF1 publicada que corresponde a este bronze: la recién subida o, si no
          # cambió, la descargada.
          FASTF1_COPY=()
          if [ "$FASTF1_USED" = "true" ]; then FASTF1_COPY=(--fastf1-manifest fastf1/bronze-fastf1.json); fi
          OPENF1_COPY=()
          if [ "$OPENF1_REFERENCE" = "new" ] && [ "$OPENF1_UPLOADED" = "success" ]; then
            OPENF1_COPY=(--openf1-manifest openf1-new/bronze-openf1.json)
          elif [ "$OPENF1_REFERENCE" = "previous" ]; then
            OPENF1_COPY=(--openf1-manifest openf1/bronze-openf1.json)
          fi
          uv run f1-ingest snapshot pack --out dist --tag "$TAG" "${FASTF1_COPY[@]}" "${OPENF1_COPY[@]}"
          uv run f1-ingest snapshot notes dist/manifest.json > dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      # Si la API no funciona con los datos nuevos, no se publica nada.
      - name: Prueba de humo de la API contra el snapshot nuevo
        env:
          F1_SMOKE_DB: dist/f1.duckdb
          F1_SMOKE_PREVIOUS_MANIFEST: snapshot/manifest.json
          F1_SMOKE_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: |
          if [ "$F1_SMOKE_ALLOW_SHRINK" = "1" ]; then
            echo "::warning::allow_shrink: se omite la comprobación de filas perdidas."
            echo "**Aviso:** publicado con allow_shrink, sin comprobar las filas perdidas." >> "$GITHUB_STEP_SUMMARY"
          fi
          uv run pytest api/tests/smoke -v -p no:cacheprovider

      - name: Publicar la release fechada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" dist/f1.duckdb dist/gold-parquet.zip dist/bronze.tar.gz dist/manifest.json \
            --title "Datos F1 ($TAG)" --notes-file dist/notes.md --latest=false

      - name: Actualizar data-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DATA_TAG" > /dev/null 2>&1; then
            gh release create "$DATA_TAG" --title "Datos F1" --notes-file dist/notes.md --latest=false
          fi
          gh release upload "$DATA_TAG" dist/f1.duckdb dist/gold-parquet.zip dist/bronze.tar.gz --clobber
          # manifest.json va el último: es el puntero que lee la API, que descarga la base de la
          # release fechada que indica (ya completa), nunca de estos ficheros a medio subir.
          gh release upload "$DATA_TAG" dist/manifest.json --clobber
          gh release edit "$DATA_TAG" --notes-file dist/notes.md

      - name: Retención de las releases fechadas
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            | jq -r --argjson keep "$KEEP_DATED_RELEASES" \
                '[.[] | select(.tagName | test("^data-[0-9]{4}-[0-9]{2}-[0-9]{2}"))] | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName' \
            | while read -r old; do
                if [ -n "$old" ] && [ "$old" != "$TAG" ]; then
                  echo "Se borra la release antigua $old"
                  gh release delete "$old" --cleanup-tag --yes
                fi
              done

      - name: Documentación de dbt (catálogo y linaje)
        if: vars.PUBLISH_DOCS == 'true'
        working-directory: transform
        run: |
          uv run dbt docs generate --profiles-dir . --static
          mkdir -p ../site && cp target/static_index.html ../site/index.html

      - name: Preparar la publicación de la documentación
        if: vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Guardar los logs de dbt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbt-logs
          path: |
            transform/logs/
            transform/target/run_results.json
          if-no-files-found: ignore

  docs:
    name: Publicar la documentación de dbt
    needs: pipeline
    if: vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
