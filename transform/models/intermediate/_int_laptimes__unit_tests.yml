      la vuelta 1 de p1 y la posición se recalcula; FastF1 y Jolpica dan ya ese orden, así que no
      se añade position:majority (se compara con la posición recalculada, no con la original).
      Carrera 71 (como las vueltas bajo SC de 2024 R19): FastF1 y Jolpica coinciden y discrepan
      de formula1db en 156 ms; por debajo de 1 s es convención, no se corrige (timing_convention).
