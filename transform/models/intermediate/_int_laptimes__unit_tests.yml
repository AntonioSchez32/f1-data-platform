version: 2

# Reglas de int_laptimes: un unit test por regla, con el fixture mínimo (solo las columnas que usa).
unit_tests:
  - name: test_laptimes_merge_sources_and_validation
    description: >
      Fusión de las tres fuentes en la carrera 10 (d1-d3 en formula1db, d4 solo en FastF1):
      formula1db manda y FastF1/Jolpica solo validan (una fila por vuelta); confirmed (±1 ms,
      también con el tiempo de FastF1 sumado de sectores: fastf1:sectors), timing_convention
      (vuelta 1 y diferencia < 1 s), disputed (≥ 1 s sin mayoría), single_source; mayoría de
      FastF1 y Jolpica desde la vuelta 2 (la vuelta 1 no se corrige); FastF1 aporta el piloto que
      falta en formula1db (tiempo de sectores marcado) y Jolpica la vuelta suelta que falta dentro
      de las oficiales. Carrera 11: corrección del seed con evidencia.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 10, season: 2019}
          - {race_id: 11, season: 2019}
      - input: ref('int_lap_numbering')
        rows:
          - {race_id: 10, numbering_status: consistent, applied_lap_shift: 0}
      - input: ref('lap_corrections')
        rows:
          - {race_id: 11, driver_id: d1, lap_number: 3, column_name: lap_time_ms, original_value: 99999, corrected_value: 90100}
      - input: ref('int_race_data_corrected')
        rows:
          - {race_id: 10, session_type: RACE_RESULT, driver_id: d1, race_laps: 3, position_number: 1, race_shared_car: false}
          - {race_id: 10, session_type: RACE_RESULT, driver_id: d2, race_laps: 4, position_number: 2, race_shared_car: false}
          - {race_id: 10, session_type: RACE_RESULT, driver_id: d3, race_laps: 3, position_number: 3, race_shared_car: false}
          - {race_id: 10, session_type: RACE_RESULT, driver_id: d4, race_laps: 2, position_number: 4, race_shared_car: false}
          - {race_id: 11, session_type: RACE_RESULT, driver_id: d1, race_laps: 3, position_number: 1, race_shared_car: false}
      - input: ref('int_driver_race_numbers')
        rows:
          - {race_id: 10, driver_number: "1", driver_id: d1}
          - {race_id: 10, driver_number: "2", driver_id: d2}
          - {race_id: 10, driver_number: "3", driver_id: d3}
          - {race_id: 10, driver_number: "4", driver_id: d4}
      - input: ref('int_formula1db_laps')
        rows:
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 1, lap_time_ms: 100000, is_red_flag: false}
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 2, lap_time_ms: 90000, is_red_flag: false}
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 3, lap_time_ms: 90000, is_red_flag: false}
          - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 1, lap_time_ms: 101000, is_red_flag: false}
          - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 2, lap_time_ms: 90000, is_red_flag: false}
          - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 3, lap_time_ms: 90000, is_red_flag: false}
          - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 1, lap_time_ms: 102000, is_red_flag: false}
          - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 2, lap_time_ms: 90000, is_red_flag: false}
          - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 3, lap_time_ms: 90000, is_red_flag: false}
          - {race_id: 11, driver_id: d1, driver_number: "1", lap_number: 3, lap_time_ms: 99999, race_time_ms: 270000, position: 1, is_red_flag: false}
      - input: ref('int_fastf1_laps')
        rows:
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 1, lap_time_ms: 100600, is_lap_time_from_sectors: false}
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 2, lap_time_ms: 90000, is_lap_time_from_sectors: false}
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 3, lap_time_ms: 91500, is_lap_time_from_sectors: false}
          - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 2, lap_time_ms: 90500, is_lap_time_from_sectors: false}
          - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 3, lap_time_ms: 95000, is_lap_time_from_sectors: false}
          - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 2, lap_time_ms: 90001, is_lap_time_from_sectors: true}
          - {race_id: 10, driver_id: d4, driver_number: "4", lap_number: 1, lap_time_ms: 92000, is_lap_time_from_sectors: false}
          - {race_id: 10, driver_id: d4, driver_number: "4", lap_number: 2, lap_time_ms: 92500, is_lap_time_from_sectors: true}
      - input: ref('int_openf1_race_reliability')
        rows: []
      - input: ref('int_openf1_laps')
        rows: []
      - input: ref('int_jolpica_laps')
        rows:
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 1, lap_time_ms: 100600}
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 2, lap_time_ms: 90000}
          - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 3, lap_time_ms: 91500}
          - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 4, lap_time_ms: 93000}
      - input: ref('int_tyre_compound_mapping')
        rows: []
    expect:
      rows:
        - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 1, source: formula1db, lap_time_ms: 100000, validation_status: timing_convention, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 100000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 2, source: formula1db, lap_time_ms: 90000, validation_status: confirmed, confirmed_by: "[jolpica, fastf1]", corrections: "[]", original_lap_time_ms: 90000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d1, driver_number: "1", lap_number: 3, source: formula1db, lap_time_ms: 91500, validation_status: corrected, confirmed_by: "[]", corrections: "[lap_time_ms:majority]", original_lap_time_ms: 90000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 1, source: formula1db, lap_time_ms: 101000, validation_status: single_source, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 101000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 2, source: formula1db, lap_time_ms: 90000, validation_status: timing_convention, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 90000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 3, source: formula1db, lap_time_ms: 90000, validation_status: disputed, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 90000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d2, driver_number: "2", lap_number: 4, source: jolpica, lap_time_ms: 93000, validation_status: single_source, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 93000, lap_numbering_status: not_applicable}
        - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 1, source: formula1db, lap_time_ms: 102000, validation_status: single_source, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 102000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 2, source: formula1db, lap_time_ms: 90000, validation_status: confirmed, confirmed_by: "[fastf1:sectors]", corrections: "[]", original_lap_time_ms: 90000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d3, driver_number: "3", lap_number: 3, source: formula1db, lap_time_ms: 90000, validation_status: single_source, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 90000, lap_numbering_status: consistent}
        - {race_id: 10, driver_id: d4, driver_number: "4", lap_number: 1, source: fastf1, lap_time_ms: 92000, validation_status: single_source, confirmed_by: "[]", corrections: "[]", original_lap_time_ms: 92000, lap_numbering_status: not_applicable}
        - {race_id: 10, driver_id: d4, driver_number: "4", lap_number: 2, source: fastf1, lap_time_ms: 92500, validation_status: single_source, confirmed_by: "[]", corrections: "[lap_time_ms:sectors]", original_lap_time_ms: null, lap_numbering_status: not_applicable}
        - {race_id: 11, driver_id: d1, driver_number: "1", lap_number: 3, source: formula1db, lap_time_ms: 90100, validation_status: corrected, confirmed_by: "[]", corrections: "[lap_time_ms:seed]", original_lap_time_ms: 99999, lap_numbering_status: no_evidence}

  - name: test_laptimes_red_flag_on_suspension_lap
    description: >
      Bandera roja en la vuelta que contiene la suspensión (vars red_flag_*: más de
      max(400 s, 3 × mediana) y marca de roja en esa vuelta o en las 3 anteriores, o 3 pilotos).
      Carrera 20: tres pilotos con la vuelta 5 larga y sin marcas (regla de los 3 pilotos).
      Carrera 21: un solo piloto con la vuelta larga y una marca en la vuelta anterior (rama con
      menos de 3 pilotos). Carrera 22: un piloto, marca fuera de la ventana (vuelta 1 para la 5):
      no se marca. Carrera 23: la vuelta larga ya estaba marcada: no se añade la corrección.
      Carrera 24: mediana de 150 s, así que el umbral es 3 × mediana = 450 s y tres vueltas de
      420 s no cuentan. Las vars se fijan en el test: prueba la regla, no la configuración.
    model: int_laptimes
    overrides:
      vars:
        red_flag_min_lap_ms: 400000
        red_flag_median_factor: 3
        red_flag_window_laps: 3
        red_flag_min_drivers: 3
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 20, season: 2020}
          - {race_id: 21, season: 2020}
          - {race_id: 22, season: 2020}
          - {race_id: 23, season: 2020}
          - {race_id: 24, season: 2020}
      - input: ref('int_lap_numbering')
        rows: []
      - input: ref('lap_corrections')
        rows: []
      - input: ref('int_race_data_corrected')
        rows: []
      - input: ref('int_driver_race_numbers')
        rows: []
      - input: ref('int_fastf1_laps')
        rows: []
      - input: ref('int_openf1_race_reliability')
        rows: []
      - input: ref('int_openf1_laps')
        rows: []
      - input: ref('int_jolpica_laps')
