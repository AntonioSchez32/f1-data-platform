        rows:
          - {race_id: 70, driver_id: p1, driver_number: "1", lap_number: 1, lap_time_ms: 90000, position: 1}
          - {race_id: 70, driver_id: p2, driver_number: "2", lap_number: 1, lap_time_ms: 90500, position: 2}
          - {race_id: 71, driver_id: p1, driver_number: "1", lap_number: 2, lap_time_ms: 150156, position: 1}
