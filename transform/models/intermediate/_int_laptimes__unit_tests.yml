  - name: test_laptimes_openf1_only_races_and_jolpica_backup
    description: >
      Carreras sin formula1db ni FastF1 (DAT-06, decisión 50); la decisión de sustituir viene de
      int_openf1_race_reliability (tiene su propio test). Carrera 90: OpenF1 fiable y completa es
      la base, contrastada con Jolpica (confirmed, timing_convention en la vuelta 1, disputed con
      2 s), y Jolpica rellena la vuelta 4 que le falta (N8). Carrera 91: OpenF1 no fiable y
      Jolpica completa: base Jolpica, sin contraste (OpenF1 no fiable no confirma). Carrera 92: a
      OpenF1 le faltan vueltas: base Jolpica, confirmada por OpenF1 donde la tiene. Carrera 93:
      sin Jolpica, OpenF1 single_source. Carrera 94: OpenF1 no fiable pero Jolpica incompleta: se
      queda OpenF1 (con aviso), disputed frente a Jolpica. Carrera 95: sin OpenF1, base Jolpica.
