  - name: test_laptimes_a6_official_end
    description: >
      Regla A6. Carrera 30: el ganador tiene una vuelta más allá de las oficiales (resultado tomado
      antes de la bandera a cuadros real), así que se quitan las vueltas posteriores al final
      oficial de los clasificados (w y r2), pero no las del no clasificado (x). Carrera 31 (control):
      el ganador no pasa de las oficiales, así que la vuelta de más de r se conserva.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 30, season: 2019}
          - {race_id: 31, season: 2019}
      - input: ref('int_race_data_corrected')
        rows:
          - {race_id: 30, session_type: RACE_RESULT, driver_id: w, race_laps: 2, position_number: 1, race_shared_car: false}
          - {race_id: 30, session_type: RACE_RESULT, driver_id: r2, race_laps: 2, position_number: 2, race_shared_car: false}
          - {race_id: 30, session_type: RACE_RESULT, driver_id: x, race_laps: 1, position_number: null, race_shared_car: false}
          - {race_id: 31, session_type: RACE_RESULT, driver_id: w, race_laps: 2, position_number: 1, race_shared_car: false}
          - {race_id: 31, session_type: RACE_RESULT, driver_id: r, race_laps: 2, position_number: 2, race_shared_car: false}
      - input: ref('int_formula1db_laps')
        rows:
          - {race_id: 30, driver_id: w, driver_number: "1", lap_number: 1, lap_time_ms: 90000}
          - {race_id: 30, driver_id: w, driver_number: "1", lap_number: 2, lap_time_ms: 90000}
          - {race_id: 30, driver_id: w, driver_number: "1", lap_number: 3, lap_time_ms: 90000}
          - {race_id: 30, driver_id: r2, driver_number: "2", lap_number: 1, lap_time_ms: 90000}
          - {race_id: 30, driver_id: r2, driver_number: "2", lap_number: 2, lap_time_ms: 90000}
          - {race_id: 30, driver_id: r2, driver_number: "2", lap_number: 3, lap_time_ms: 90000}
          - {race_id: 30, driver_id: x, driver_number: "3", lap_number: 1, lap_time_ms: 90000}
          - {race_id: 30, driver_id: x, driver_number: "3", lap_number: 2, lap_time_ms: 90000}
          - {race_id: 31, driver_id: w, driver_number: "1", lap_number: 1, lap_time_ms: 90000}
          - {race_id: 31, driver_id: w, driver_number: "1", lap_number: 2, lap_time_ms: 90000}
          - {race_id: 31, driver_id: r, driver_number: "2", lap_number: 1, lap_time_ms: 90000}
          - {race_id: 31, driver_id: r, driver_number: "2", lap_number: 2, lap_time_ms: 90000}
          - {race_id: 31, driver_id: r, driver_number: "2", lap_number: 3, lap_time_ms: 90000}
      - input: ref('int_lap_numbering')
        rows: []
      - input: ref('lap_corrections')
        rows: []
      - input: ref('int_fastf1_laps')
        rows: []
      - input: ref('int_ergast_laps')
        rows: []
      - input: ref('int_driver_race_numbers')
        rows: []
      - input: ref('int_tyre_compound_mapping')
        rows: []
    expect:
      rows:
        - {race_id: 30, driver_id: w, lap_number: 1}
        - {race_id: 30, driver_id: w, lap_number: 2}
        - {race_id: 30, driver_id: r2, lap_number: 1}
        - {race_id: 30, driver_id: r2, lap_number: 2}
        - {race_id: 30, driver_id: x, lap_number: 1}
        - {race_id: 30, driver_id: x, lap_number: 2}
        - {race_id: 31, driver_id: w, lap_number: 1}
        - {race_id: 31, driver_id: w, lap_number: 2}
        - {race_id: 31, driver_id: r, lap_number: 1}
        - {race_id: 31, driver_id: r, lap_number: 2}
        - {race_id: 31, driver_id: r, lap_number: 3}

  - name: test_laptimes_position_recalc_and_majority
    description: >
      Carrera 40: la corrección del seed (vuelta 2 de p1, 100 s → 90 s) invierte el orden, así que
      la posición y la diferencia con el líder se recalculan con el tiempo acumulado corregido
      (position:recalculated). Carrera 41: FastF1 y Ergast dan a p1 la posición 1 y formula1db la 2
      (position:majority); con p2 no coinciden entre sí y se conserva formula1db.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 40, season: 2019}
          - {race_id: 41, season: 2019}
      - input: ref('lap_corrections')
        rows:
          - {race_id: 40, driver_id: p1, lap_number: 2, column_name: lap_time_ms, original_value: 100000, corrected_value: 90000}
      - input: ref('int_formula1db_laps')
        rows:
          - {race_id: 40, driver_id: p1, driver_number: "1", lap_number: 1, lap_time_ms: 90000, race_time_ms: 90000, position: 1, gap_to_leader_ms: 0}
          - {race_id: 40, driver_id: p1, driver_number: "1", lap_number: 2, lap_time_ms: 100000, race_time_ms: 190000, position: 2, gap_to_leader_ms: 4500}
          - {race_id: 40, driver_id: p2, driver_number: "2", lap_number: 1, lap_time_ms: 90500, race_time_ms: 90500, position: 2, gap_to_leader_ms: 500}
          - {race_id: 40, driver_id: p2, driver_number: "2", lap_number: 2, lap_time_ms: 95000, race_time_ms: 185500, position: 1, gap_to_leader_ms: 0}
          - {race_id: 41, driver_id: p1, driver_number: "1", lap_number: 2, lap_time_ms: 90000, position: 2}
          - {race_id: 41, driver_id: p2, driver_number: "2", lap_number: 2, lap_time_ms: 90000, position: 1}
      - input: ref('int_fastf1_laps')
        rows:
          - {race_id: 41, driver_id: p1, driver_number: "1", lap_number: 2, lap_time_ms: 90000, position: 1}
          - {race_id: 41, driver_id: p2, driver_number: "2", lap_number: 2, lap_time_ms: 90000, position: 2}
      - input: ref('int_ergast_laps')
        rows:
          - {race_id: 41, driver_number: "1", lap_number: 2, lap_time_ms: 90000, position: 1}
          - {race_id: 41, driver_number: "2", lap_number: 2, lap_time_ms: 90000, position: 1}
      - input: ref('int_lap_numbering')
        rows: []
      - input: ref('int_race_data_corrected')
        rows: []
      - input: ref('int_driver_race_numbers')
        rows: []
      - input: ref('int_tyre_compound_mapping')
        rows: []
    expect:
      rows:
        - {race_id: 40, driver_id: p1, lap_number: 1, position: 1, gap_to_leader_ms: 0, original_position: 1, corrections: "[]"}
        - {race_id: 40, driver_id: p1, lap_number: 2, position: 1, gap_to_leader_ms: 0, original_position: 2, corrections: "[lap_time_ms:seed, position:recalculated]"}
        - {race_id: 40, driver_id: p2, lap_number: 1, position: 2, gap_to_leader_ms: 500, original_position: 2, corrections: "[]"}
        - {race_id: 40, driver_id: p2, lap_number: 2, position: 2, gap_to_leader_ms: 5500, original_position: 1, corrections: "[position:recalculated]"}
        - {race_id: 41, driver_id: p1, lap_number: 2, position: 1, gap_to_leader_ms: null, original_position: 2, corrections: "[position:majority]"}
        - {race_id: 41, driver_id: p2, lap_number: 2, position: 1, gap_to_leader_ms: null, original_position: 1, corrections: "[]"}

  - name: test_laptimes_applied_lap_shift
    description: >
      Carrera renumerada (int_lap_numbering con applied_lap_shift -1): las vueltas 2 y 3 de
      formula1db pasan a ser la 1 y la 2, se conserva original_lap_number y el cruce con FastF1 se
      hace con la vuelta ya desplazada (la 1 queda confirmada).
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 50, season: 2019}
      - input: ref('int_lap_numbering')
        rows:
          - {race_id: 50, numbering_status: renumbered, applied_lap_shift: -1}
      - input: ref('int_formula1db_laps')
        rows:
          - {race_id: 50, driver_id: d1, driver_number: "1", lap_number: 2, lap_time_ms: 91000}
          - {race_id: 50, driver_id: d1, driver_number: "1", lap_number: 3, lap_time_ms: 92000}
      - input: ref('int_fastf1_laps')
        rows:
          - {race_id: 50, driver_id: d1, driver_number: "1", lap_number: 1, lap_time_ms: 91000, is_lap_time_from_sectors: false}
      - input: ref('lap_corrections')
        rows: []
      - input: ref('int_race_data_corrected')
        rows: []
      - input: ref('int_ergast_laps')
        rows: []
      - input: ref('int_driver_race_numbers')
        rows: []
      - input: ref('int_tyre_compound_mapping')
        rows: []
    expect:
      rows:
        - {race_id: 50, driver_id: d1, lap_number: 1, original_lap_number: 2, lap_numbering_status: renumbered, validation_status: confirmed}
        - {race_id: 50, driver_id: d1, lap_number: 2, original_lap_number: 3, lap_numbering_status: renumbered, validation_status: single_source}

  - name: test_laptimes_ergast_fill_within_official_laps
    description: >
      Ergast solo rellena las vueltas que faltan en formula1db dentro de las oficiales: con 2
      vueltas oficiales, entra la 2 y no la 3.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 60, season: 2019}
      - input: ref('int_race_data_corrected')
        rows:
          - {race_id: 60, session_type: RACE_RESULT, driver_id: d1, race_laps: 2, position_number: 2, race_shared_car: false}
      - input: ref('int_driver_race_numbers')
        rows:
          - {race_id: 60, driver_number: "1", driver_id: d1}
      - input: ref('int_formula1db_laps')
        rows:
          - {race_id: 60, driver_id: d1, driver_number: "1", lap_number: 1, lap_time_ms: 90000}
      - input: ref('int_ergast_laps')
        rows:
          - {race_id: 60, driver_number: "1", lap_number: 2, lap_time_ms: 90500}
          - {race_id: 60, driver_number: "1", lap_number: 3, lap_time_ms: 91000}
      - input: ref('int_lap_numbering')
        rows: []
      - input: ref('lap_corrections')
        rows: []
      - input: ref('int_fastf1_laps')
        rows: []
      - input: ref('int_tyre_compound_mapping')
        rows: []
    expect:
      rows:
        - {race_id: 60, driver_id: d1, lap_number: 1, source: formula1db}
        - {race_id: 60, driver_id: d1, lap_number: 2, source: ergast}

  - name: test_laptimes_timing_convention_long_laps
    description: >
      Vuelta de más de 300 s (neutralización o suspensión) en la que las fuentes discrepan en más
      de 1 s: timing_convention, no disputed.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 70, season: 2019}
      - input: ref('int_formula1db_laps')
        rows:
          - {race_id: 70, driver_id: d1, driver_number: "1", lap_number: 2, lap_time_ms: 310000}
      - input: ref('int_fastf1_laps')
        rows:
          - {race_id: 70, driver_id: d1, driver_number: "1", lap_number: 2, lap_time_ms: 320000, is_lap_time_from_sectors: false}
      - input: ref('int_lap_numbering')
        rows: []
      - input: ref('lap_corrections')
        rows: []
      - input: ref('int_race_data_corrected')
        rows: []
      - input: ref('int_ergast_laps')
        rows: []
      - input: ref('int_driver_race_numbers')
        rows: []
      - input: ref('int_tyre_compound_mapping')
        rows: []
    expect:
