  - name: test_laptimes_fastf1_majority_with_openf1_and_jolpica
    description: >
      Carreras de FastF1 (2025+, decisión 27): OpenF1 fiable y Jolpica (PDF de la FIA) forman
      mayoría contra FastF1. Carrera 80, vuelta 2: los dos dan 91,5 s y la posición 2 frente a
      90 s y la 3 de FastF1: se corrigen tiempo y posición (corrected, original conservado).
      Vuelta 3: discrepan en 156 ms (convención, no se corrige). Vuelta 4: OpenF1 y Jolpica no
      coinciden en la posición: se conserva la de FastF1; los dos confirman el tiempo. Jolpica
      rellena la vuelta 5, que falta en FastF1 (N8), y no la 6, fuera de las oficiales. Carrera
      81: OpenF1 no es fiable, así que no hay mayoría y Jolpica sola deja la vuelta en disputed.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 80, season: 2025}
          - {race_id: 81, season: 2025}
      - input: ref('int_race_data_corrected')
        rows:
          - {race_id: 80, session_type: RACE_RESULT, driver_id: d1, race_laps: 5, position_number: 2, race_shared_car: false}
          - {race_id: 81, session_type: RACE_RESULT, driver_id: d1, race_laps: 2, position_number: 2, race_shared_car: false}
      - input: ref('int_fastf1_laps')
        rows:
