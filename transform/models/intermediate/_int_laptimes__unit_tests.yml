  - name: test_laptimes_position_majority_per_lap_without_repeats
    description: >
      La mayoría de posición se aplica por vuelta y nunca repite posiciones (B4 de D2b). Carrera
      75 (como Japón 2024, vuelta 2): t, sin voto (FastF1 no tiene su vuelta), conserva la P1 de
      formula1db; v recibiría la P1 por mayoría de FastF1 y Jolpica, así que en esa vuelta no se
      aplica (queda como disputa en qa_position_majority_withheld). En la vuelta 3 los dos tienen
      voto e intercambian posiciones sin repetir: se aplica a los dos. Carrera 76 (base FastF1):
      lo mismo con OpenF1 y Jolpica; en la vuelta 2, a no tiene voto y b recibiría su P1.
    model: int_laptimes
    given:
      - input: ref('stg_f1db__races')
        rows:
          - {race_id: 75, season: 2024}
          - {race_id: 76, season: 2026}
      - input: ref('int_race_data_corrected')
        rows:
          - {race_id: 76, session_type: RACE_RESULT, driver_id: a, race_laps: 2, position_number: 1, race_shared_car: false}
          - {race_id: 76, session_type: RACE_RESULT, driver_id: b, race_laps: 2, position_number: 2, race_shared_car: false}
