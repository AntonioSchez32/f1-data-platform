version: 2

models:
  - name: int_driver_race_numbers
    description: >
      Dorsal de cada piloto en cada carrera, tomado solo de las sesiones de carrera, parrilla y
      clasificación (y las del sprint). Es la clave con la que se cruzan por dorsal las vueltas de
      FastF1 y Jolpica, las de formula1db.com (dorsal y nombre) y la telemetría de clasificación.
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_number, driver_id]
      # Un dorsal, un piloto: es lo que permite cruzar FastF1, Jolpica y la telemetría solo por
      # dorsal. Antes de 1982 el dorsal era del coche y hay 151 parejas legítimas con dos pilotos
      # (coches compartidos en carrera, relevos y coches que clasificó un piloto y corrió otro;
      # formula1db.com se cruza también por nombre). Desde 1982 no hay ninguna.
      - unique_combination:
          arguments:
            columns: [race_id, driver_number]
          config:
            where: "season >= 1982"
    columns:
      - name: driver_id
        data_tests: [not_null]
      - name: driver_number
        data_tests: [not_null]

  - name: int_fastf1_laps
    description: "Vueltas de carrera de FastF1 con las claves de F1DB (carrera y piloto por dorsal)."
    data_tests:
      # Si un dorsal tuviera dos pilotos en la carrera, el cruce duplicaría las vueltas sin aviso.
      - unique_combination:
          arguments:
            columns: [race_id, driver_number, lap_number]

  - name: int_openf1_sessions
    description: >
      Sesiones de OpenF1 (2023+) con la carrera de F1DB de su Gran Premio: la sesión de carrera se
      casa por temporada y fecha (local, con un día de margen) y el resto de sesiones del meeting
      la heredan.
    data_tests:
      - unique_combination:
          arguments:
            columns: [session_key]
      # Una carrera de F1DB tiene como mucho una sesión de carrera de OpenF1.
      - unique_combination:
          arguments:
            columns: [race_id]
          config:
            where: "is_race and race_id is not null"
    columns:
      - name: race_id
        description: >
          Carrera de F1DB. Nula si F1DB aún no la ha publicado: no se modela y se cuenta en
          qa_summary (openf1_race_session_matching), sin detener la publicación.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_f1db__races')
                field: race_id
      - name: is_name_consistent
        description: >
          Control del casamiento: el nombre del Gran Premio en OpenF1 coincide con el de F1DB (las
          excepciones conocidas se revisan a mano: el test solo avisa).
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
              config:
                severity: warn
                where: "is_race and race_id is not null"

  - name: int_openf1_laps
    description: >
      Vueltas de carrera de OpenF1 (2023+) con las claves de F1DB, la posición al acabar la vuelta
      (endpoint position, contrastada con el orden de paso por meta), el neumático (stints), las
      entradas a boxes y el estado de pista derivado de la dirección de carrera.
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_number, lap_number]
    columns:
      - name: driver_id
        description: >
          Piloto de F1DB por el dorsal de la carrera. Una vuelta sin cruzar no se pierde en
          silencio: este test avisa, el control openf1_lap_driver_attribution la cuenta y las notas
          de la release la anuncian; no pasa a fact_laptimes.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: position_status
        data_tests:
          - accepted_values:
              arguments:
                values: [agreed, disputed, position_only, timing_only]

  - name: int_openf1_race_reliability
    description: >
      Concordancia de los tiempos de OpenF1 por carrera con la referencia (FastF1, formula1db o,
      en las carreras sin ninguna de las dos, Jolpica: DAT-06); las que no llegan a
      openf1_min_race_time_agreement_pct no se usan para contrastar. En las carreras medidas
      contra Jolpica decide si Jolpica sustituye a OpenF1 como base (is_replaced_by_jolpica).
    columns:
      - name: race_id
        data_tests: [unique, not_null]
      - name: reference_source
        data_tests:
          - accepted_values:
              arguments:
                values: [fastf1, formula1db, jolpica]
      - name: is_reliable
        data_tests: [not_null]
      - name: is_missing_laps
        description: "OpenF1 cubre menos de openf1_min_lap_coverage_pct de las vueltas de Jolpica."
        data_tests: [not_null]
      - name: is_jolpica_complete
        description: "Jolpica tiene al menos jolpica_min_lap_coverage_pct de las vueltas oficiales."
        data_tests: [not_null]
      - name: is_replaced_by_jolpica
        data_tests: [not_null]

  - name: int_jolpica_drivers
    description: >
      Piloto de F1DB de cada driverRef de Jolpica (dorsal compartido en carrera confirmado por la
      fecha de nacimiento o el apellido), para los controles de resultados, clasificación y
      paradas frente a F1DB.
    columns:
      - name: driver_ref
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests: [unique, not_null]

  - name: int_jolpica_laps
    description: >
      Vueltas de Jolpica (1996+) con la carrera de F1DB y el dorsal de sus resultados de carrera.
      driver_id es nulo mientras F1DB no tenga los resultados de la carrera (no se publican).
    data_tests:
      # Si un dorsal tuviera dos pilotos o un piloto dos dorsales, el cruce duplicaría vueltas.
      - unique_combination:
          arguments:
            columns: [race_id, driver_number, lap_number]
    columns:
      - name: race_id
        data_tests: [not_null]
      - name: driver_number
        data_tests: [not_null]
