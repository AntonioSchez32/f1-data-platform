version: 2

models:
  - name: dim_driver
    description: "Pilotos de F1 con nacionalidad y país de nacimiento desnormalizados."
    columns:
      - name: driver_id
        description: "Identificador de F1DB (p. ej. `lewis-hamilton`)."
        data_tests: [unique, not_null]
      - name: nationality_alpha2
        description: "Código ISO 3166-1 alfa-2 de la nacionalidad (banderas en la web)."

  - name: dim_constructor
    description: "Constructores (equipos) con su país."
    columns:
      - name: constructor_id
        data_tests: [unique, not_null]

  - name: dim_engine_manufacturer
    description: "Fabricantes de motores."
    columns:
      - name: engine_manufacturer_id
        data_tests: [unique, not_null]

  - name: dim_tyre_manufacturer
    description: "Fabricantes de neumáticos."
    columns:
      - name: tyre_manufacturer_id
        data_tests: [unique, not_null]

  - name: dim_race
    description: >
      Carreras (Grandes Premios) con temporada, circuito y Gran Premio desnormalizados.
      Incluye las carreras futuras del calendario (`is_completed = false`).
    columns:
      - name: race_id
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: is_completed
        description: "Verdadero si la carrera ya tiene resultados."
      - name: has_sprint
        description: >
          Fin de semana con carrera sprint: tiene resultado de sprint (2021-2023, donde F1DB no da
          la fecha) o fecha de sprint en el calendario (carreras futuras).
      - name: is_season_final_race
        description: "Última ronda de la temporada (clasificación final del campeonato)."

  - name: fact_race_result
    description: "Resultado de cada piloto en cada carrera o carrera sprint."
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, session_type, position_display_order]
    columns:
      - name: session_type
        data_tests:
          - accepted_values:
              arguments:
                values: [RACE, SPRINT]
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: constructor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_constructor')
                field: constructor_id
      - name: engine_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_engine_manufacturer')
                field: engine_manufacturer_id
      - name: tyre_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tyre_manufacturer')
                field: tyre_manufacturer_id
      - name: position_text
        description: >
          Posición o motivo de no clasificación: DNF, DNS, DSQ, NC, EX (excluido), DNQ (no
          se clasificó), DNPQ (no pasó la precalificación) y DNP (no participó). Si es una
          posición, coincide con position_number (assert_position_text_matches_number).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DNF, DNP, DNPQ, DNQ, DNS, DSQ, EX, NC]
              config:
                where: "not regexp_full_match(position_text, '[1-9][0-9]*')"
      - name: is_corrected
        description: "La fila procede de una corrección del seed `race_data_corrections` (Script-2.sql)."
      - name: overridden_columns
        description: "Columnas corregidas con evidencia documentada (seed `race_data_overrides`)."
      - name: disputed_columns
        description: "Columnas marcadas como disputadas: las fuentes no se ponen de acuerdo."

  - name: fact_qualifying_result
    description: "Resultados de clasificación (y clasificación sprint) con diferencia porcentual con la pole."
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, session_type, position_display_order]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: session_type
        data_tests:
          - accepted_values:
              arguments:
                values: [QUALIFYING, SPRINT_QUALIFYING]
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: constructor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_constructor')
                field: constructor_id
      - name: engine_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_engine_manufacturer')
                field: engine_manufacturer_id
      - name: tyre_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tyre_manufacturer')
                field: tyre_manufacturer_id
      - name: position_text
        description: "Posición o motivo sin posición: DSQ, EX o NC (sin tiempo)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DSQ, EX, NC]
              config:
                where: "not regexp_full_match(position_text, '[1-9][0-9]*')"
      - name: gap_to_pole_pct
        description: "Porcentaje sobre el mejor tiempo de la sesión."

  - name: fact_pit_stops
    description: >
      Paradas en boxes reales según F1DB (desde 1994). Coinciden al 100 % con las paradas de los
      resúmenes oficiales de la FIA contrastados; no incluyen penalizaciones, pasos detrás del
      Safety Car ni entradas con bandera roja (ver fact_pit_lane_passes).
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_id, stop_number]
      - unique_combination:
          arguments:
            columns: [race_id, position_display_order]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: constructor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_constructor')
                field: constructor_id
      - name: engine_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_engine_manufacturer')
                field: engine_manufacturer_id
      - name: tyre_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tyre_manufacturer')
                field: tyre_manufacturer_id
      - name: stop_number
        data_tests: [not_null]

  - name: fact_pit_lane_passes
    description: >
      Todas las entradas al pit lane registradas en las vueltas, tipificadas (decisión N4):
      parada real de F1DB, bandera roja, retirada, Safety Car, penalización u otra.
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_id, driver_number, lap_number]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: pass_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pit_stop, red_flag, retirement, safety_car, penalty_or_other, unclassified]
      - name: driver_number
        data_tests: [not_null, not_blank]
      - name: stop_number
        description: "Número de parada en F1DB cuando `pass_type = pit_stop`."

  - name: fact_laptimes
    description: >
      Tiempos por vuelta fusionados (int_laptimes): formula1db.com es la fuente principal
      (1950-2024) y FastF1 la completa (stint, vida del neumático, speed trap, estado de pista) y
      aporta las carreras y pilotos que formula1db no tiene. OpenF1 (2023+) aporta las carreras
      que aún no tienen FastF1 y contrasta el resto. Ergast solo valida y rellena vueltas sueltas.
      Las vueltas corridas después del final oficial se eliminan.
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_id, driver_number, lap_number]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: driver_number
        description: >
          Dorsal del coche. Distingue los dos coches de un piloto en la misma carrera (años 50-60).
          Si formula1db.com lo trae vacío (el #0 de Damon Hill en 1993-1994), es el de F1DB.
        data_tests: [not_null, not_blank]
      - name: source
        description: >
          Fuente de la vuelta: formula1db, fastf1, openf1 (carreras sin FastF1; CC BY-NC-SA 4.0)
          o ergast (relleno marcado).
        data_tests:
          - accepted_values:
              arguments:
                values: [formula1db, fastf1, openf1, ergast]
      - name: lap_time_ms
        description: >
          Tiempo de la vuelta. En FastF1, si falta pero están los tres sectores, es su suma
          (corrections: lap_time_ms:sectors).
      - name: gap_to_leader_ms
        description: "Diferencia con el líder al final de la vuelta."
      - name: is_red_flag
        description: >
          Vuelta con bandera roja: la vuelta en la que se muestra (según la fuente) y la que
          contiene la suspensión (corrections: is_red_flag:suspension).
      - name: tyre_compound
        description: "Compuesto tal como lo publica la fuente de la vuelta (nulo si no hay dato)."
      - name: tyre_compound_pirelli
        description: "Compuesto real de Pirelli: C0-C6 (2019-2023) o nombre comercial (hasta 2018)."
      - name: tyre_compound_relative
        description: >
          Compuesto relativo de la carrera (HARD, MEDIUM, SOFT, INTERMEDIATE, WET) desde 2019. En
          2019-2023 se obtiene cruzando formula1db (real) con FastF1 (relativo), carrera a carrera.
      - name: tyre_age_laps
        description: "Vida del neumático (FastF1 cuando existe; si no, formula1db)."
      - name: formula1db_tyre_age_laps
        description: "Vida del neumático según formula1db.com (se conserva para contraste)."
      - name: is_incomplete_lap
        description: >
          Vuelta de abandono no completada (FastF1 la registra; no cuenta como vuelta oficial). Nunca
          en coches compartidos ni descalificados (quality_status shared_car o disqualified): sus
          vueltas oficiales en F1DB no sirven para compararlas.
      - name: quality_status
        description: >
          Conciliación del piloto en esa carrera con el resultado oficial (int_lap_completeness):
          ok, shared_car, disqualified, missing_laps, extra_laps.
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, shared_car, disqualified, missing_laps, extra_laps]
      - name: validation_status
        description: >
          confirmed (otra fuente da el mismo tiempo), timing_convention, disputed (otra fuente
          discrepa sin mayoría; se conserva formula1db), corrected (seed con evidencia o mayoría)
          o single_source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [confirmed, timing_convention, disputed, corrected, single_source]
      - name: confirmed_by
        description: >
          Fuentes que dan el mismo tiempo: ergast, fastf1, fastf1:sectors (el tiempo de FastF1 es
          la suma de sus sectores) u openf1 (mismo feed que FastF1: no es una confirmación
          independiente de sus vueltas).
      - name: corrections
        description: >
          Correcciones aplicadas a la vuelta: lap_time_ms:seed, lap_time_ms:majority,
          lap_time_ms:sectors (tiempo calculado con los sectores de FastF1),
          is_red_flag:suspension (vuelta que contiene la suspensión), position:recalculated,
          position:majority y position:timing (OpenF1 sin posición en el endpoint position: se usa
          el orden de paso por meta).
      - name: original_lap_time_ms
        description: "Tiempo tal como venía en la fuente, antes de corregirlo."
      - name: original_position
        description: "Posición tal como venía en la fuente, antes de corregirla."
      - name: lap_numbering_status
        description: >
          Numeración frente a F1DB (int_lap_numbering): consistent, renumbered, pit_lap_convention
          (F1DB apunta la parada una vuelta después; España 1994), inconsistent (las vueltas rápidas
          o paradas de F1DB de esa carrera usan otra numeración, o alguna de las dos evidencias no
          llega al 80 % de casos con el mismo desfase: Pacífico 1994 y São Paulo 2023 tienen las
          vueltas rápidas al 100 % pero no las paradas), no_evidence o not_applicable
          (vueltas que no son de formula1db).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [consistent, renumbered, pit_lap_convention, inconsistent, no_evidence, not_applicable]

  - name: fact_driver_standing
    description: "Clasificación del campeonato de pilotos tras cada carrera."
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_id]
      - unique_combination:
          arguments:
            columns: [race_id, position_display_order]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id

  - name: fact_constructor_standing
    description: >
      Clasificación del campeonato de constructores tras cada carrera. F1DB la da por constructor
      y motor (en los años 50-60 un mismo chasis con dos motores puntuaba por separado).
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, constructor_id, engine_manufacturer_id]
      - unique_combination:
          arguments:
            columns: [race_id, position_display_order]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: constructor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_constructor')
                field: constructor_id
      - name: engine_manufacturer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_engine_manufacturer')
                field: engine_manufacturer_id

  - name: fact_quali_telemetry
    description: "Telemetría cada 10 m de la vuelta más rápida de clasificación (FastF1)."
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, driver_id, distance_m]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id

  - name: fact_race_control_message
    description: >
      Mensajes de dirección de carrera de la carrera (banderas, Safety Car, VSC, bandera roja,
      investigaciones, sanciones, DRS), 2018+. Una sola fuente por carrera: FastF1 si la tiene
      (preferente) y si no OpenF1 (2023+, CC BY-NC-SA 4.0).
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, message_seq]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: message_seq
        description: "Orden del mensaje en la carrera (por tiempo de publicación)."
        data_tests: [not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [fastf1, openf1]
      - name: message_utc
        description: "Hora UTC del mensaje."
      - name: session_time_ms
        description: "Tiempo de sesión en que se publicó (solo FastF1), comparable con las vueltas."
      - name: lap_number
        description: "Vuelta del líder cuando se publicó el mensaje."
      - name: driver_id
        description: "Piloto afectado (mensajes de un coche), por su dorsal en la carrera."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: message
        data_tests: [not_null]

  - name: fact_weather_sample
    description: >
      Meteo de la carrera, una muestra por minuto, 2018+. Una sola fuente por carrera: FastF1 si la
      tiene (preferente; `sample_utc` estimado) y si no OpenF1 (2023+, CC BY-NC-SA 4.0).
    data_tests:
      - unique_combination:
          arguments:
            columns: [race_id, sample_seq]
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: sample_seq
        data_tests: [not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [fastf1, openf1]
      - name: sample_utc
        description: >
          Hora UTC de la muestra. En FastF1 es una estimación (tiempo de sesión más la hora del
          tiempo cero calculada con los mensajes de dirección de carrera; nula si no los hay).
      - name: session_time_ms
        description: "Tiempo de sesión de la muestra (solo FastF1, dato original)."
