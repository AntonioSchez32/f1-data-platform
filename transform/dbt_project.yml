name: f1
version: "1.0.0"
config-version: 2
profile: f1

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  f1:
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
    quality:
      +materialized: table
      +schema: quality

seeds:
  f1:
    +schema: silver

vars:
  # Bandera roja en la vuelta que contiene la suspensión (int_laptimes y su test): vuelta más
  # larga que max(red_flag_min_lap_ms, red_flag_median_factor × mediana de la carrera), con una
  # marca de roja en esa vuelta o en las red_flag_window_laps anteriores, o al menos
  # red_flag_min_drivers pilotos así en la misma vuelta.
  red_flag_min_lap_ms: 400000
  red_flag_median_factor: 3
  red_flag_window_laps: 3
  red_flag_min_drivers: 3
  # Posición de OpenF1 al acabar la vuelta (int_openf1_laps): la última del endpoint position
  # hasta el fin de la vuelta más esta tolerancia, porque la posición se publica un instante
  # después del paso por meta. Calibrada contra FastF1 con 2023-2024 y validada con 2025.
  openf1_position_tolerance_ms: 500
  # Concordancia mínima (%) de los tiempos de OpenF1 con la fuente publicada para usarlo como
  # contraste en una carrera (int_openf1_race_reliability). Las carreras sanas están por encima
  # del 99 %; Australia 2026, con las vueltas desplazadas, en el 0,4 %.
  openf1_min_race_time_agreement_pct: 90
  # Carreras sin formula1db ni FastF1 (DAT-06, decisión 50): a OpenF1 «le faltan vueltas» si
  # cubre menos de este % de las vueltas de Jolpica. Precisión de la decisión 50 (D2b): no basta
  # una vuelta suelta, porque el relleno por vuelta (N8) ya la cubre y sustituir la carrera entera
  # perdería compuestos, sectores y banderas. Con datos reales separa Miami 2025 (53,6 %, faltan
  # las vueltas 1-24) de 2026 R12 (99,8 %, faltan 3 vueltas). 100 = la lectura literal.
  openf1_min_lap_coverage_pct: 98
  # Jolpica solo sustituye a OpenF1 en una carrera si tiene al menos este % de las vueltas
  # oficiales de F1DB (el mismo umbral que el cargador): desde 2025 sus vueltas salen de los PDF
  # de la FIA y pueden llegar tarde o a medias.
  jolpica_min_lap_coverage_pct: 95
